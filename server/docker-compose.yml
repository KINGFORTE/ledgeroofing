services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledgeroofing
      POSTGRES_USER: ledgeroofing
      POSTGRES_PASSWORD: change-this-local-password
    ports:
      - "5432:5432"
    volumes:
      - ledgeroofing-postgres:/var/lib/postgresql/data

volumes:
  ledgeroofing-postgres:
